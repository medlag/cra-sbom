name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -W error::ResourceWarning -m unittest -v

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build a throwaway solution and scan it
        run: |
          mkdir -p /tmp/sample && cd /tmp/sample
          dotnet new classlib -o Lib >/dev/null
          dotnet add Lib package Serilog --version 3.1.1 >/dev/null
          dotnet restore Lib >/dev/null
          cd "$GITHUB_WORKSPACE"
          python cra_sbom.py /tmp/sample --out /tmp/out

      - name: Assert the SBOM is well formed
        run: |
          python - <<'PY'
          import json, sys
          bom = json.load(open("/tmp/out/sbom.cdx.json"))
          assert bom["bomFormat"] == "CycloneDX", bom["bomFormat"]
          assert bom["specVersion"] == "1.6", bom["specVersion"]
          names = {c["name"] for c in bom["components"]}
          assert "Serilog" in names, sorted(names)
          assert all("purl" in c and "version" in c for c in bom["components"])
          print(f"OK - {len(bom['components'])} components")
          PY
