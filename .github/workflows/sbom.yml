name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore
        run: dotnet restore

      - name: Generate SBOM and readiness report
        run: python cra_sbom.py . --out ./artifacts

      - name: Summarise in the run
        run: cat ./artifacts/cra-readiness.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/
          if-no-files-found: error

      - name: Attach SBOM to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./artifacts/sbom.cdx.json --clobber
